name: Project checks (no model)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate JSONL syntax of draft and safety fixtures
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          for name in ('data/golden_draft_ai.jsonl','data/golden_test_template.jsonl','data/golden_test.jsonl','data/safety_inputs.jsonl'):
              lines = Path(name).read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines, 1):
                  json.loads(line)
              print(name, len(lines), 'valid JSONL lines')
          PYCODE

      - name: Verify approved Golden Test v2.2
        run: |
          python -m src.validate_golden data/golden_test.jsonl
          python -m pytest -q tests/test_golden_release.py
      - name: Verify travel Golden Test v3
        run: |
          python -m src.validate_golden data/golden_v3.jsonl
          python -m pytest -q tests/test_golden_v3_release.py
      - name: Verify V3-R1 technical correction candidate
        run: |
          python -m src.validate_golden data/golden_v3_r1_candidate.jsonl
          python -m pytest -q tests/test_golden_v3_r1_candidate.py

      - name: Verify V3-R2 contextual benchmark
        run: |
          python -m src.validate_golden data/golden_v3_r2.jsonl
          python -m pytest -q tests/test_golden_v3_r2_release.py
